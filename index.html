<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RideFlow Bahamas</title>
  <!-- Leaflet CSS for Real Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      background: linear-gradient(rgba(9, 13, 22, 0.85), rgba(9, 13, 22, 0.95)), 
                  url('https://images.unsplash.com/photo-1582967788606-a171c1080cb0?q=80&w=1200&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    .landing-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .landing-screen h1 {
      color: #ffffff;
      font-size: 26px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .landing-screen p {
      color: #a0aec0;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .btn-main-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 300px;
    }
    .btn-ride-main {
      background: #c5a059;
      color: #090d16;
      padding: 16px;
      font-weight: bold;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-driver-main {
      background: transparent;
      color: #c5a059;
      border: 2px solid #c5a059;
      padding: 15px;
      font-weight: bold;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .admin-link {
      margin-top: 40px;
      color: #4a5568;
      font-size: 11px;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }
    .app-section {
      display: none;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #121824;
      border: 1px solid #c5a059;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .back-btn {
      background: transparent;
      color: #c5a059;
      border: 1px solid #c5a059;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 20px;
      cursor: pointer;
    }
    label {
      display: block;
      color: #a0aec0;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 12px;
      background: #1a2233;
      border: 1px solid rgba(197, 160, 89, 0.4);
